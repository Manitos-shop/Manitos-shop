<meta charset="utf-8">

<title>Manitos Shop · Catálogo Brainrots V2</title>
<style>
:root {
  --bg:#0a0711; --panel:#171027; --panel2:#24173e; --line:#3b2a63;
  --text:#fff; --muted:#b9add6; --gold:#f6c945; --purple:#9b5cff;
  --ok:#2bb673; --bad:#d9534f; --warn:#d9a72e;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(180deg,#08050d,#140d20);color:var(--text)}
.wrap{max-width:1120px;margin:auto;padding:18px}
.hero{text-align:center;padding:26px 8px 14px}
.hero h1{margin:0;font-size:34px;letter-spacing:.3px}
.hero h1 span{color:var(--gold)}
.hero p{margin:8px 0 0;color:var(--muted)}
.toolbar{position:sticky;top:0;z-index:10;background:rgba(10,7,17,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.search{width:100%;padding:15px 16px;border-radius:14px;border:1px solid var(--line);background:#120d20;color:#fff;font-size:17px;outline:none}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.filters button,.az button{border:1px solid var(--line);background:var(--panel);color:#fff;border-radius:10px;padding:8px 11px;cursor:pointer}
.filters button.active,.az button.active{background:var(--purple);border-color:var(--purple)}
.az{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.summary{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:16px 0;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 10px 25px rgba(0,0,0,.18)}
.thumb{height:150px;background:linear-gradient(135deg,#21143b,#110b1d);display:flex;align-items:center;justify-content:center;color:#7f70a0;font-size:14px;border-bottom:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover}
.body{padding:15px}
.title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.title-row h3{margin:0;font-size:18px;line-height:1.25}
.star{font-size:18px}
.badges{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}
.badge{font-size:12px;padding:5px 8px;border-radius:999px;background:#120d20;color:var(--muted);border:1px solid var(--line)}
.status{font-weight:700}
.status.disponible{color:var(--ok)}
.status.agotado{color:var(--bad)}
.status.por_confirmar{color:var(--warn)}
.price{font-size:23px;font-weight:800;color:var(--gold);margin:8px 0 12px}
.buy{width:100%;border:0;border-radius:11px;padding:12px;background:var(--gold);color:#171100;font-weight:800;cursor:pointer;font-size:15px}
.copy{width:100%;margin-top:8px;border:1px solid var(--line);border-radius:11px;padding:10px;background:#120d20;color:#fff;cursor:pointer}
.empty{display:none;text-align:center;padding:40px;color:var(--muted)}
.info{margin-top:20px;padding:14px;border:1px dashed var(--line);border-radius:13px;color:var(--muted);line-height:1.45}
.footer{text-align:center;color:var(--muted);padding:24px 0 8px}
@media (max-width:560px){.hero h1{font-size:30px}.thumb{height:135px}}
</style>
</head>

const grid = document.getElementById('grid');
const search = document.getElementById('search');
const count = document.getElementById('count');
const empty = document.getElementById('empty');
const az = document.getElementById('az');
const filterLabel = document.getElementById('filterLabel');
const filterButtons = [...document.querySelectorAll('.filters button')];

let currentFilter = 'all';
let currentLetter = 'Todos';

function normalize(s) {
  return (s || '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
}

function statusText(s) {
  if (s === 'disponible') return 'Disponible';
  if (s === 'agotado') return 'Agotado';
  return 'Por confirmar';
}

function filteredItems() {
  const q = normalize(search.value.trim());
  return items.filter(item => {
    const matchesSearch = normalize(item.name).includes(q);
    const matchesLetter = currentLetter === 'Todos' || normalize(item.name).startsWith(currentLetter.toLowerCase());
    const matchesFilter =
      currentFilter === 'all' ||
      (currentFilter === 'featured' && item.featured) ||
      item.stock === currentFilter;
    return matchesSearch && matchesLetter && matchesFilter;
  });
}

function openWhatsApp(item) {
  const price = item.price ? ` Precio: ${item.price} MX.` : '';
  const mut = item.mutation ? ` Mutación: ${item.mutation}.` : '';
  const msg = `Hola Admin Keren🍓, vengo del catálogo de Manitos Shop. Me interesa: ${item.name}.${price}${mut} ¿Está disponible?`;
  window.open(`https://wa.me/${PHONE}?text=${encodeURIComponent(msg)}`, '_blank');
}

function render() {
  const list = filteredItems();
  grid.innerHTML = '';
  count.textContent = list.length;
  empty.style.display = list.length ? 'none' : 'block';

  list.forEach(item => {
    const card = document.createElement('article');
    card.className = 'card';

    const media = item.image
      ? `<div class="thumb"><img src="${item.image}" alt="${item.name}"></div>`
      : `<div class="thumb">Imagen próximamente</div>`;

    const price = item.price ? `$${item.price} MX` : 'Precio por definir';
    const mutation = item.mutation || 'Mutación: —';

    card.innerHTML = `
      ${media}
      <div class="body">
        <div class="title-row">
          <h3>${item.name}</h3>
          <span class="star">${item.featured ? '⭐' : ''}</span>
        </div>
        <div class="badges">
          <span class="badge status ${item.stock}">${statusText(item.stock)}</span>
          <span class="badge">${mutation}</span>
        </div>
        <div class="price">${price}</div>
        <button class="buy">Preguntar por WhatsApp</button>
        <button class="copy">Copiar nombre</button>
      </div>`;

    card.querySelector('.buy').onclick = () => openWhatsApp(item);
    card.querySelector('.copy').onclick = async () => {
      try {
        await navigator.clipboard.writeText(item.name);
        alert('Nombre copiado: ' + item.name);
      } catch {
        alert(item.name);
      }
    };
    grid.appendChild(card);
  });
}

filterButtons.forEach(btn => {
  btn.onclick = () => {
    filterButtons.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    filterLabel.textContent = btn.textContent;
    render();
  };
});

['Todos', ...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'].forEach(letter => {
  const b = document.createElement('button');
  b.textContent = letter;
  if (letter === 'Todos') b.classList.add('active');
  b.onclick = () => {
    [...az.children].forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    currentLetter = letter;
    render();
  };
  az.appendChild(b);
});

search.addEventListener('input', render);
